name: Import BenriTool source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-benritool.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/part*.b64 > /tmp/benri.b64
          base64 -d /tmp/benri.b64 > /tmp/BenriTool-v1.5-source.zip
          rm -rf /tmp/benri-src
          mkdir -p /tmp/benri-src
          unzip -q /tmp/BenriTool-v1.5-source.zip -d /tmp/benri-src
          test -d /tmp/benri-src/UtilityLightApp

          rm -rf .transport app
          rm -f README.md HEALTH_CHECK.md UI_AUDIT.md build.gradle.kts gradle.properties settings.gradle.kts .gitignore
          rm -f .github/workflows/import-benritool.yml

          cp -a /tmp/benri-src/UtilityLightApp/. .

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import BenriTool v1.5 source"
          git push origin HEAD:main
